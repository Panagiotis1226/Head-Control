name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: head-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test against real headscale v0.29.3
        run: |
          set -euo pipefail
          docker network create hcnet

          # Minimal headscale config in database policy mode.
          mkdir -p /tmp/hs
          cat > /tmp/hs/config.yaml <<'EOF'
          server_url: http://headscale:8080
          listen_addr: 0.0.0.0:8080
          metrics_listen_addr: 127.0.0.1:9090
          private_key_path: /var/lib/headscale/private.key
          noise:
            private_key_path: /var/lib/headscale/noise_private.key
          prefixes:
            v4: 100.64.0.0/10
            v6: fd7a:115c:a1e0::/48
          database:
            type: sqlite
            sqlite:
              path: /var/lib/headscale/db.sqlite
          policy:
            mode: database
          dns:
            magic_dns: true
            base_domain: example.internal
            nameservers:
              global: [1.1.1.1]
          derp:
            server:
              enabled: false
            urls: []
            paths: []
          EOF

          docker run -d --name headscale --network hcnet \
            -v /tmp/hs:/etc/headscale headscale/headscale:v0.29.3 serve
          for i in $(seq 1 30); do
            docker exec headscale headscale users list >/dev/null 2>&1 && break
            sleep 1
          done
          APIKEY=$(docker exec headscale headscale apikeys create | tail -1)

          # A fresh named volume at /data is deliberate: it regression-tests
          # that the image seeds /data with nonroot ownership (a root-owned
          # volume broke v0.1.0 with "unable to open database file").
          docker volume create hc-data
          docker run -d --name head-control --network hcnet -p 8000:8000 \
            -v hc-data:/data \
            -e HEADSCALE_URL=http://headscale:8080 \
            -e HEADSCALE_API_KEY="$APIKEY" \
            -e ADMIN_PASSWORD=ci-test-password \
            -e COOKIE_SECURE=false \
            head-control:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/auth/session >/dev/null && break
            sleep 1
          done

          # Login and exercise a few endpoints end-to-end.
          CSRF=$(curl -sf -c /tmp/jar -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-test-password"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["csrfToken"])')
          curl -sf -b /tmp/jar http://localhost:8000/api/meta | grep -q '"reachable":true'
          curl -sf -b /tmp/jar -X POST http://localhost:8000/api/hs/users \
            -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"name":"ci-user"}' | grep -q '"ci-user"'
          curl -sf -b /tmp/jar http://localhost:8000/api/policy | grep -q '"mode"'
          curl -sf -b /tmp/jar -X PUT http://localhost:8000/api/policy \
            -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"policy":"{\"acls\":[{\"action\":\"accept\",\"src\":[\"*\"],\"dst\":[\"*:*\"]}]}"}' \
            | grep -q '"mode":"database"'
          echo "smoke test passed"
      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs head-control || true
          docker logs headscale || true
