name: Dev image

# Publishes a pre-release image for every push to the dev branch so changes
# can be tried without building locally:
#   ghcr.io/<owner>/head-control:dev          (moving tag, latest dev push)
#   ghcr.io/<owner>/head-control:dev-<sha>    (pinned to one commit)
# It never touches :latest, version tags or the hs-v0.29 alias — those come
# only from release.yaml.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to derive the version
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/head-control
          tags: |
            type=raw,value=dev
            type=raw,value=dev-{{sha}}
      - id: version
        # Shown in the UI footer as e.g. "0.1.1-dev": the latest release tag
        # plus a -dev suffix (the commit is still identifiable via the
        # dev-<sha> image tag).
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          base=${latest#v}; base=${base%-dev} # a v0.1.2-dev tag yields 0.1.2-dev, not 0.1.2-dev-dev
          echo "version=${base}-dev" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
